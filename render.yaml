services:
  - type: web
    name: enthra-web
    env: node
    buildCommand: "npm install --prefix backend && npm install --prefix frontend && npm run build --prefix frontend && npm run build --prefix backend"
    startCommand: "cd backend && npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: enthra-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: enthra-db
    databaseName: enthra
    user: enthra_user
