services:
  # Backend API - Web Service
  - type: web
    name: enthra-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # DATABASE_URL must be added manually in Render dashboard (use Neon.tech free tier)

  # Frontend - Static Site
  - type: web
    name: enthra-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set VITE_API_URL to your backend URL, e.g. https://enthra-api.onrender.com
      - key: VITE_API_URL
        value: ""
      - key: VITE_SOCKET_URL
        value: ""
