services:
  - type: web
    name: enthra-web
    env: node
    plan: free
    buildCommand: "npm install --prefix backend && npm install --prefix frontend && npm run build --prefix frontend && npm run build --prefix backend"
    startCommand: "cd backend && npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # You will need to add DATABASE_URL manually in the Render dashboard
